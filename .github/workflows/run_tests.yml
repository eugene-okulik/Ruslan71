name: Python autotests

on:
  push:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: choose tests set
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - extended
          - all

defaults:
  run:
    working-directory: homework_37

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: run all tests
        if: ${{ github.event_name == 'push' || github.event.inputs.deployment_target == 'all' }}
        run: pytest --alluredir=allure-results

      - name: run smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_target == 'smoke' }}
        run: pytest -m smoke --alluredir=allure-results

      - name: run regression tests
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_target == 'regression' }}
        run: pytest -m regression --alluredir=allure-results

      - name: run extended tests
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_target == 'extended' }}
        run: pytest -m extended --alluredir=allure-results

      - name: Install Java
        if: always()
        uses: actions/setup-java@v3
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Install Allure
        if: always()
        working-directory: .
        run: >
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          && sudo tar -zxvf allure-2.24.1.tgz -C /opt/
          && sudo ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure

      - name: Generate report
        if: always()
        run: allure generate -c allure-results -o _site
        continue-on-error: true

      - name: Save allure report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: _site
          path: homework_37/_site
          retention-days: 1
